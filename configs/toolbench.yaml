# ShortChain ToolBench Benchmark Configuration
# ============================================

ingest:
  format: "json"
  success_only: false
  field_map:
    task_id: "task_id"
    intent: "query"
    spans: "steps"
    app_name: "category"
    agent_name: "agent"
    action: "action"
    observation: "observation"
    thoughts: "thoughts"

features:
  text_encoder: "tfidf"
  tfidf_max_features: 5000
  context_fields:
    - "intent"
    - "app_name"
    - "n_spans"
    - "previous_tools"
    - "last_thought"
  include_state_features: true
  include_dependency_features: true

negatives:
  strategy: "mixed"
  hard_negative_ratio: 0.6
  same_app_weight: 0.5
  co_usage_weight: 0.3
  similarity_weight: 0.2

dataset:
  negative_ratio: 5
  negative_strategy: "mixed"
  context_fields:
    - "intent"
    - "app_name"
    - "n_spans"
    - "previous_tools"
    - "last_thought"
  text_encoder: "tfidf"
  tfidf_max_features: 5000

splitter:
  n_folds: 10
  test_size: 0.2
  group_by: "task_id"
  stratify_by:
    - "app_name"

classifier:
  model_type: "xgboost"
  xgboost:
    n_estimators: 300
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 2
    eval_metric: "logloss"
    early_stopping_rounds: 20

inference:
  top_k: 5
  confidence_threshold: 0.5

evaluation:
  k_values: [1, 3, 5, 10]
  metrics:
    - "r_precision"
    - "recall_at_k"
    - "accuracy"
    - "f1"
