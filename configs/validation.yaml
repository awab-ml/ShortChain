# ShortChain P0 Validation — AppWorld (HALO Gemini traces)
# ========================================================
# Protocol: task-level 5-fold, frozen train corpus stats, faithful candidate
# pools (catalog-wide + app-scoped), baselines (random, popularity, BM25),
# macro metrics with paired-bootstrap 95% CI.

level: task   # task | span (span = per-decision, state-aware P1)

data:
  traces_path: "data/traces.jsonl"
  success_only: false          # label G(t) = tools used (all traces by default)
  appworld_api_dir: "data/appworld_api/function_calling"  # P2: tool descriptions + arg schemas (empty to disable)

split:
  n_folds: 5

eval:
  pools:
    catalog_wide: true         # candidate pool = full catalog (91 tools)
    app_scoped: true           # candidate pool = tools of the task's app(s)
  k_values: [1, 3, 5, 7, 9]

metrics:
  headline: ["r_precision", "recall_at_1", "recall_at_3", "recall_at_7", "recall_at_9", "mrr", "ndcg_at_5"]

calibration:
  method: "platt"              # platt | isotonic
  decision: "r_precision_complete"   # task decision = full-shortlist correctness (P@R == 1); adaptive R = |relevant|
  inner_folds: 5               # group-aware nested OOF folds for fitting the calibrator
  thresholds_points: 41        # resolution of the risk-coverage sweep

hybrid:
  llm_results: "models/validation/llm_results.json"   # cost-bound LLM baseline cache
  local_cost_usd: 0.0000002    # README micro-cost per local read
  local_latency_ms: 0.3        # measured local per-task latency

baselines:
  enabled: ["random", "popularity", "bm25"]

negatives:
  strategy: "hard"
  hard_negative_ratio: 0.6
  same_app_weight: 0.8
  co_usage_weight: 0.15
  similarity_weight: 0.05

dataset:
  negative_ratio: 3

classifier:
  model_type: "xgboost"
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    eval_metric: "logloss"
    early_stopping_rounds: 20

seeds: 5

bootstrap:
  n_boot: 2000
  seed: 42
  ci: 0.95

output_dir: "models/validation/p0"
