[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shortchain"
version = "0.1.0"
description = "An observability backend for LLM applications that learns execution patterns from OpenTelemetry traces and adapts tool selection to cut cost and latency."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "ShortChain Authors"},
]
maintainers = [
    {name = "ShortChain Authors"},
]
keywords = ["observability", "opentelemetry", "openllmetry", "llm", "agents", "tracing", "tools", "openllmetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.4.1",
]
otel = [
    "opentelemetry-api>=1.38.0,<2",
    "opentelemetry-sdk>=1.38.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0,<2",
    "opentelemetry-proto>=1.38.0,<2",
    "opentelemetry-semantic-conventions>=0.59b0",
    "opentelemetry-semantic-conventions-ai>=0.5.1,<0.6.0",
]
receiver = [
    "shortchain[otel]",
    "starlette>=0.37",
    "uvicorn>=0.27",
]
sdk = [
    "shortchain[otel]",
    "opentelemetry-instrumentation-threading>=0.59b0",
    "opentelemetry-instrumentation-langchain>=0.62.0,<0.63",
    "opentelemetry-instrumentation-openai>=0.62.0,<0.63",
    "opentelemetry-instrumentation-openai-agents>=0.62.0,<0.63",
    "opentelemetry-instrumentation-crewai>=0.62.0,<0.63",
    "opentelemetry-instrumentation-agno>=0.62.0,<0.63",
    "opentelemetry-instrumentation-mcp>=0.62.0,<0.63",
    "opentelemetry-instrumentation-anthropic>=0.62.0,<0.63",
    "opentelemetry-instrumentation-litellm>=0.62.0,<0.63",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "httpx>=0.27",
    "build>=1.0",
]

[project.scripts]
shortchain = "shortchain.cli:main"

[project.urls]
Homepage = "https://github.com/awab-ml/ShortChain"
Documentation = "https://github.com/awab-ml/ShortChain#readme"
Repository = "https://github.com/awab-ml/ShortChain"
Issues = "https://github.com/awab-ml/ShortChain/issues"
Changelog = "https://github.com/awab-ml/ShortChain/releases"

[tool.hatch.build.targets.wheel]
packages = ["shortchain"]

[tool.hatch.build.targets.sdist]
include = [
    "shortchain/**",
    "configs/**",
    "docs/**",
    "examples/**",
    "scripts/**",
    "tests/**",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100