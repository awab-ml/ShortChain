[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shortchain"
version = "0.0.2"
description = "Replace expensive LLM decision components in agentic systems with compact tabular-textual classifiers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ShortChain Authors"},
]
keywords = ["agent", "classifier", "tabular", "LLM", "optimization"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.4.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["shortchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
