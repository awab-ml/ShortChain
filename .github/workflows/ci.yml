name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run core test suite
        run: pytest tests/ -q
      - name: Ruff lint
        run: ruff check shortchain/ tests/ scripts/

  telemetry:
    name: Telemetry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with sdk + receiver extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sdk,receiver]"
      - name: Run telemetry + ingest suites
        run: pytest tests/telemetry tests/ingest -q